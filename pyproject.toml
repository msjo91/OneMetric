[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "onemetric"
version = "0.1.0"
description = "One-shot merging of LoRA clients at a server, chosen by one label-free score"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "numpy", "scipy", "torch", "transformers", "datasets", "huggingface_hub", "safetensors", "pillow",
]

[project.optional-dependencies]
llava = ["peft", "accelerate", "bitsandbytes", "pycocoevalcap"]
test = ["pytest"]

[tool.setuptools]
packages = ["onemetric"]
